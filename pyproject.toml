[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simultex"
version = "0.1.0"
description = "A PTY proxy that renders LaTeX as transparent terminal images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William Wang" }]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pyte>=0.8.2,<0.9",
    "uvicorn>=0.30,<1",
    "websockets>=14,<16",
]

[project.scripts]
simultex = "simultex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simultex"]

[tool.hatch.build.targets.wheel.force-include]
"assets/simultex.ansi" = "simultex/assets/simultex.ansi"

[tool.pytest.ini_options]
testpaths = ["tests"]
