[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "anytex"
version = "0.1.0"
description = "A PTY proxy that renders LaTeX as transparent terminal images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anytex contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pyte>=0.8.2,<0.9",
    "uvicorn>=0.30,<1",
]

[project.scripts]
anytex = "anytex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anytex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
